<!-- docs-layout.component.html -->
<div class="docs-layout" [class.docs-layout--home]="isHome">
  <app-navbar 
    (menuToggle)="onMenuToggle()"
    (searchFocus)="onSearchFocus()">
  </app-navbar>
  
  <div class="docs-layout__body">
    <app-sidebar 
      [isOpen]="sidebarOpen"
      [hideOnDesktop]="isHome"
      (close)="onSidebarClose()">
    </app-sidebar>
    
    <main class="docs-layout__content" [class.docs-layout__content--full]="isHome">
      <div class="docs-layout__container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <app-search-modal 
    *ngIf="searchModalOpen"
    (close)="onSearchClose()">
  </app-search-modal>
</div>
